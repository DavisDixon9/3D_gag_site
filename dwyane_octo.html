<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocktopus - Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-8">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <a href="index.html" class="text-blue-500 hover:underline mb-4 inline-block">&larr; Back to Home</a>
        
        <div class="flex flex-col md:flex-row gap-6 mt-4">
           <img src="Dwyane.png" alt="gumdrop" class="md:w-1/2 h-64 object-cover rounded-lg shadow-sm">
            <div class="md:w-1/2 flex flex-col justify-center">
                <h1 class="text-3xl font-bold mb-2">Rocktopus</h1>
                <p class="text-2xl text-green-600 font-semibold mb-4">$8.99</p>
                <p class="text-gray-600 mb-6">The 3D Printed Rocktopus, a captivating fusion of nature's rugged beauty and the whimsical charm of an octopus.</p>
                <!-- Notice the added "flex-wrap" on the main div, and "shrink-0 whitespace-nowrap" on the link -->
                <div class="mt-4 p-4 bg-[#008CFF]/10 border border-[#008CFF]/20 rounded-lg flex flex-col gap-3">
                    <div class="flex items-center gap-3">
                        <img src="venmo-logo.png" alt="Venmo" class="w-8 h-8 object-contain rounded-md shrink-0">
                        <div>
                            <p class="text-xs text-gray-500 font-bold uppercase tracking-wider leading-tight">Send Payment</p>
                            <p class="text-lg font-bold text-gray-900 leading-tight">@davisdixon</p>
                        </div>
                    </div>
                    <a href="https://venmo.com/davisdixon" target="_blank" class="block w-full bg-[#008CFF] text-white py-2 px-4 rounded-lg font-bold hover:bg-blue-700 transition shadow-sm text-center whitespace-nowrap">
                        Open Venmo
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
